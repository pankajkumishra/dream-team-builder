services:
  postgres:
    image: postgres:16
    container_name: dream-team-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dream_team_builder
    volumes:
      - dream_team_pgdata:/var/lib/postgresql/data

volumes:
  dream_team_pgdata:
